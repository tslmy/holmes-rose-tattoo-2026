<svg xmlns="http://www.w3.org/2000/svg" width="760" height="720" viewBox="0 0 760 720" role="img" aria-labelledby="title desc">
  <title id="title">Why a quick click disappeared, and how the queue preserves it</title>
  <desc id="desc">Previously, a button press and release could both be polled before the game checked the button. The game saw only the final up state. With a queue, the next two checks receive the press and release in order. This diagram is schematic, not to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c969d"/>
    </marker>
  </defs>
  <rect width="760" height="720" fill="#f4f3ee"/>
  <rect width="760" height="7" fill="#b78a4c"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="28" y="53" font-size="29" font-weight="700" fill="#202b31">A quick click, two different outcomes</text>
    <text x="28" y="84" font-size="18" fill="#53636b">Both transitions are polled before the game checks the button.</text>

    <rect x="20" y="108" width="720" height="245" rx="10" fill="#fff" stroke="#d5dad8" stroke-width="2"/>
    <text x="46" y="150" font-size="25" font-weight="700" fill="#202b31">Before: final state only</text>
    <rect x="566" y="121" width="148" height="40" rx="20" fill="#f9e9e4"/>
    <text x="640" y="147" text-anchor="middle" font-size="18" font-weight="700" fill="#a33f31">CLICK LOST</text>
    <text x="48" y="195" font-size="17" font-weight="700" fill="#718087">POLLED INPUTS</text>
    <text x="452" y="195" font-size="17" font-weight="700" fill="#718087">NEXT GAME CHECK</text>
    <rect x="48" y="213" width="127" height="58" rx="7" fill="#e9f0f3"/>
    <rect x="190" y="213" width="127" height="58" rx="7" fill="#e9f0f3"/>
    <text x="111" y="249" text-anchor="middle" font-size="25" font-weight="700" fill="#35586a">DOWN</text>
    <text x="253" y="249" text-anchor="middle" font-size="25" font-weight="700" fill="#35586a">UP</text>
    <path d="M 339 242 H 420" fill="none" stroke="#8c969d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="444" y="213" width="268" height="58" rx="7" fill="#f9e9e4"/>
    <text x="578" y="249" text-anchor="middle" font-size="25" font-weight="700" fill="#a33f31">UP ONLY</text>
    <text x="48" y="318" font-size="19" fill="#53636b">The game sees the same state as before the click.</text>

    <rect x="20" y="374" width="720" height="252" rx="10" fill="#fff" stroke="#d5dad8" stroke-width="2"/>
    <text x="46" y="416" font-size="25" font-weight="700" fill="#202b31">After: queued transitions</text>
    <rect x="554" y="387" width="160" height="40" rx="20" fill="#e6f2e9"/>
    <text x="634" y="413" text-anchor="middle" font-size="18" font-weight="700" fill="#2f724f">PRESERVED</text>
    <text x="48" y="461" font-size="17" font-weight="700" fill="#718087">POLLED INPUTS</text>
    <text x="444" y="461" font-size="17" font-weight="700" fill="#718087">NEXT TWO GAME CHECKS</text>
    <rect x="48" y="479" width="127" height="58" rx="7" fill="#e9f0f3"/>
    <rect x="190" y="479" width="127" height="58" rx="7" fill="#e9f0f3"/>
    <text x="111" y="515" text-anchor="middle" font-size="25" font-weight="700" fill="#35586a">DOWN</text>
    <text x="253" y="515" text-anchor="middle" font-size="25" font-weight="700" fill="#35586a">UP</text>
    <path d="M 339 508 H 420" fill="none" stroke="#8c969d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="444" y="479" width="127" height="58" rx="7" fill="#e6f2e9"/>
    <rect x="585" y="479" width="127" height="58" rx="7" fill="#e6f2e9"/>
    <text x="507" y="515" text-anchor="middle" font-size="25" font-weight="700" fill="#2f724f">DOWN</text>
    <text x="648" y="515" text-anchor="middle" font-size="25" font-weight="700" fill="#2f724f">UP</text>
    <text x="48" y="584" font-size="19" fill="#53636b">The game receives the press, then the release.</text>

    <text x="28" y="675" font-size="18" fill="#718087">Schematic only; the boxes are not a timing measurement.</text>
  </g>
</svg>
