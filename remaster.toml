# Configuration for `uv run remaster <stage>`. Paths are relative to this file.
# Everything here is a default; CLI flags such as --scenes override it.

[paths]
game_data = "scummvm"          # legally obtained game files (ignored by git)
work = "work"                  # stable stage outputs (ignored by git)
review = "review"              # review queue: queue.md is tracked, sheet/assets are not
scummvm = "scummvm-src/scummvm"

[llm]
# Any OpenAI-compatible server (LM Studio, Ollama's /v1, llama.cpp, ...).
base_url = "http://10.0.0.26:1234/v1"   # LM Studio on the second laptop (decision #4/#11)
api_key = "lm-studio"           # LM Studio ignores it; Ollama ignores it too
# Text model: scene briefs, QA summaries. See docs/local-models.md.
text_model = "qwen/qwen3.8-27b"
text_base_url = "http://10.0.0.26:1234/v1"
# Vision model: original-vs-redraw review, sign/text checks.
vision_model = "qwen/qwen3.8-27b"
vision_base_url = "http://10.0.0.26:1234/v1"
# Used when the remote server is unreachable or lacks the model (ChatClient.from_config).
fallback_base_url = "http://127.0.0.1:11434/v1"   # Ollama on this Mac
fallback_text_model = "qwen3.5-9b-32k"
fallback_vision_model = "qwen3.5-9b-32k"
context_tokens = 32768
timeout_s = 600
disable_thinking = true

[image]
# Backend per asset class. Names refer to entries under [image.backends].
# Provisional until the Phase 1 bake-off; recorded in review/queue.md.
backgrounds = "remote-flux2-klein-4b"   # decision #14 (2026-11-15)
sprites = "esrgan"
casting = "remote-flux2-klein-4b"
# Diffusion runs on the second laptop's image server. Local mflux backends stay defined but report
# themselves unavailable while this is false, so nothing heavy runs on this Mac's GPU (2026-11-15).
local_generation = false

[image.backends.remote-flux2-klein-4b]
# mflux on the second laptop; see docs/local-models.md "Remote image server".
# Send `image` (base64) to edit. The server sets steps itself. Key from the environment only.
tool = "http"
url = "http://10.0.0.26:8000/v1/images/generations"
model = "flux2-klein-4b"
api_key_env = "REMASTER_IMAGE_API_KEY"
fallback = "flux3-klein-edit"           # local, when the remote laptop is off
# Freedom levels (server fields since 2026-11-15; imagegen.SERVER_FIELDS): strength = share of the
# plate kept (img2img); L2 sends no strength, i.e. the free reference edit. `images` carries references.
levels = { L0 = { strength = 0.6, steps = 8 }, L1 = { strength = 0.45, steps = 8 }, L2 = { steps = 8 } }
multi_image = true

[image.backends.remote-flux2-klein-9b]
tool = "http"
url = "http://10.0.0.26:8000/v1/images/generations"
model = "flux2-klein-9b"
api_key_env = "REMASTER_IMAGE_API_KEY"
levels = { L0 = { strength = 0.6, steps = 8 }, L1 = { strength = 0.45, steps = 8 }, L2 = { steps = 8 } }
multi_image = true

[image.backends.remote-flux3-image-klein]
tool = "http"
url = "http://10.0.0.26:8000/v1/images/generations"
model = "flux3-image-klein"
api_key_env = "REMASTER_IMAGE_API_KEY"
levels = { L0 = { strength = 0.6, steps = 8 }, L1 = { strength = 0.45, steps = 8 }, L2 = { steps = 8 } }
multi_image = true

[image.backends.flux2-klein-img2img]
# Same FLUX.2 klein 9B weights as flux2-klein-edit, used as img2img. mflux's image strength is
# how strongly the init image is kept (0 = ignored), so L0 keeps the most.
tool = "mflux-generate-flux2"
model = "mflux-community/flux2-klein-9b-mflux-q4"
base_model = "flux2-klein-9b"
steps = 8
levels = { L0 = { strength = 0.7 }, L1 = { strength = 0.55 }, L2 = { strength = 0.4 } }

[image.backends.flux2-klein-edit]
tool = "mflux-generate-flux2-edit"
model = "mflux-community/flux2-klein-9b-mflux-q4"
base_model = "flux2-klein-9b"
steps = 4

[image.backends.flux3-klein-edit]
tool = "mflux-generate-flux3-edit"
model = "mflux-community/flux-3-image-klein-mflux-q8"
base_model = "flux3-image-klein"
steps = 16

[image.backends.qwen21-edit]
tool = "mflux-generate-qwen-2.1-edit"
model = "mflux-community/qwen-image-2-1-mflux-q8"
base_model = "qwen-image-2.1"
steps = 25

[image.backends.zimage-controlnet]
tool = "mflux-generate-z-image-controlnet"
model = "mflux-community/z-image-turbo-controlnet-union-2-1-mflux-q8"
base_model = "z-image-controlnet"
steps = 20
levels = { L0 = { control_strength = 0.9 }, L1 = { control_strength = 0.75 }, L2 = { control_strength = 0.55 } }

[image.backends.esrgan]
tool = "tools/upscale_rosetattoo_sprites.py"
scale = 2

[scales]
backgrounds = 4
ui = 4
text = 4
sprites = 2

[prepare]
# De-dither: edge-preserving average over neighbours whose colour is within
# `threshold` (RGB Euclidean, 0-441). Deterministic; see tools/remaster/dedither.py.
dedither_radius = 1
dedither_threshold = 48.0
dedither_iterations = 2
edge_low = 40
edge_high = 120

[thresholds]
min_free_disk_gb = 15          # the runner pauses and queues a request below this
job_max_attempts = 3
# QA gates (used from Phase 1)
max_warp_stretch = 1.6
max_sprite_offset_px = 3
max_alpha_area_change = 0.05
disk_wait_minutes = 360        # short only because of purgeable space: wait this long, then pause
l0_max_drift_px = 2.0          # p95 measured drift (original px) allowed at L0
l1_max_drift_px = 4.0          # ... and at L1
warp_grid_spacing_px = 40      # control-grid spacing of the room warp (original px)
warp_smoothness = 2.0
qa_confident_score = 0.2       # objects found this confidently in the original must be found again
bakeoff_min_change = 20.0     # bake-off: mean |shipped - original| (0-255) below this is not a remaster
sprite_min_flicker_ratio = 0.6 # sprite test: less motion than this vs the baseline walk = one still pose
sprite_max_flicker_ratio = 1.5 # sprite test: frame-to-frame change vs the ESRGAN baseline
sprite_max_drift_excess = 0.1  # DINOv2 drift beyond the baseline's own pose variation
sprite_min_pose_iou = 0.7

[golden]
# About six scenes (plus 36, added by decision #5): street, interior, haze room, a clue with writing,
# a scrolling room, a dark room. See docs/remaster-plan.md, Phase 0.
scenes = [1, 26, 18, 4, 2, 9, 36]
scene_roles = { 1 = "street (Outside 221B Baker Street)", 26 = "interior (St. Bernard's Billiard Academy; existing engine fixtures)", 18 = "haze room, bright exterior (Cleopatra's Needle)", 4 = "clue with writing (Scotland Yard sign)", 2 = "scrolling room, 1280 wide (Inside Baker Street)", 9 = "dark room (The Strangers Room, mean luma 23)", 36 = "scrolling street, 1280 wide (Spitalfields; added by decision #5)" }
# Shared VGS resources (extracted with the palette of `sprite_palette_scene`).
sprites = ["SVGAWALK.VGS", "WATSON.VGS", "RMOUSE.VGS", "OMOUSE.VGS", "ITEM01.VGS", "ITEM10.VGS"]
sprite_palette_scene = 1
sprite_roles = { "SVGAWALK.VGS" = "Holmes walk", "WATSON.VGS" = "Watson walk", "RMOUSE.VGS" = "room cursors", "OMOUSE.VGS" = "map cursors", "ITEM01.VGS" = "inventory item", "ITEM10.VGS" = "inventory item" }
# Streamed cAnims as scene/index (zero-based, as the runtime looks them up).
canims = ["026/000", "044/004"]
canim_roles = { "026/000" = "26HEXIT exit (18 frames, engine fixture exists)", "044/004" = "10 frames; the one contour fallback in the candidate pack" }

[bakeoff]
# Phase 1 (docs/remaster-plan.md): every golden scene x backend x freedom level.
# Backends that cannot run here are recorded with the reason (weights deleted, no API key).
# Remote only: the server's flux2-klein-9b and flux3-image-klein are the same models as the local
# flux2-klein-edit / flux3-klein-edit. Local-only candidates (img2img strengths, Qwen, Z-Image) are
# queued for review instead of run (review item bakeoff-local-backends).
backends = ["remote-flux2-klein-4b", "remote-flux2-klein-9b", "remote-flux3-image-klein"]
levels = ["L0", "L1", "L2"]
seed = 7
megapixels = 1.0
# ChatGPT reference images (outside the repo) for scenes that have a matching one.
reference_dir = "~/Pictures/260805 ChatGPT reimagined Holmes Rose Tattoo"
references = { 4 = "ChatGPT Image Aug 5, 2026, 10_02_50 PM.png", 2 = "ChatGPT Image Aug 4, 2026, 10_03_08 PM.png" }

[bakeoff.sprite_test]
backends = ["remote-flux2-klein-4b", "remote-flux2-klein-9b", "remote-flux3-image-klein"]
characters.holmes = { resource = "SVGAWALK.VGS", cast_frame = 88, walk = [24, 25, 26, 27, 28, 29, 30, 31], description = "Sherlock Holmes: a tall, lean man with a sharp profile, grey deerstalker cap, grey Inverness cape coat over a black frock coat and waistcoat, white shirt, black trousers and shoes." }
characters.watson = { resource = "WATSON.VGS", cast_frame = 88, walk = [24, 25, 26, 27, 28, 29, 30, 31], description = "Dr John Watson: a sturdy man with a moustache, black bowler hat, dark brown three-piece suit, striped orange and blue wool scarf, white shirt, dark shoes." }
