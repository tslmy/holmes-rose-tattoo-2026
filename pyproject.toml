[project]
name = "rose-tattoo-modernization-lab"
version = "0.1.0"
description = "Tooling for extracting, upscaling, and validating graphics for The Lost Files of Sherlock Holmes: The Case of the Rose Tattoo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0",
]

[project.optional-dependencies]
flux = [
    "torch>=2.3",
    "torchvision>=0.18",
    "diffusers>=0.31",
    "transformers>=4.44",
    "accelerate>=0.33",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
    "gguf>=0.10",
]
esrgan = [
    "torch>=2.3",
    "spandrel>=0.4",
]

[tool.uv]
package = false
